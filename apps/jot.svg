<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Jot</title>
  <defs>
    <!-- matte pink, lighter at the top, as in Callie's logo -->
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f7aed0"/>
      <stop offset="1" stop-color="#d8639c"/>
    </linearGradient>
  </defs>

  <!-- the pages, peeking out behind the cover -->
  <rect x="21.5" y="27.5" width="90" height="92" rx="21" fill="#f4bcd6"/>

  <!-- the spiral binding: each wire loops over the top edge and tucks behind the cover -->
  <g fill="none" stroke="#a23f72" stroke-width="5" stroke-linecap="round">
    <path d="M34 26 Q34 12 40 30"/>
    <path d="M51.5 26 Q51.5 12 57.5 30"/>
    <path d="M69 26 Q69 12 75 30"/>
    <path d="M86.5 26 Q86.5 12 92.5 30"/>
  </g>

  <rect x="18" y="24" width="90" height="92" rx="22" fill="url(#body)"/>

  <g fill="#a23f72">
    <circle cx="34" cy="33" r="3.5"/>
    <circle cx="51.5" cy="33" r="3.5"/>
    <circle cx="69" cy="33" r="3.5"/>
    <circle cx="86.5" cy="33" r="3.5"/>
  </g>
  <g fill="none" stroke="#a23f72" stroke-width="5" stroke-linecap="round">
    <path d="M34 33 L34 24"/>
    <path d="M51.5 33 L51.5 24"/>
    <path d="M69 33 L69 24"/>
    <path d="M86.5 33 L86.5 24"/>
  </g>

  <g fill="#e0508e" opacity="0.55">
    <ellipse cx="39" cy="89" rx="8.5" ry="5"/>
    <ellipse cx="87" cy="89" rx="8.5" ry="5"/>
  </g>

  <!-- happy closed eyes and a small smile -->
  <g fill="none" stroke="#3a1630" stroke-linecap="round">
    <path d="M43.5 80 Q50 71.5 56.5 80" stroke-width="4.5"/>
    <path d="M69.5 80 Q76 71.5 82.5 80" stroke-width="4.5"/>
    <path d="M57 90 Q63 96.5 69 90" stroke-width="4"/>
  </g>
</svg>
