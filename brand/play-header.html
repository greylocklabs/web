<!doctype html>
<!-- The Google Play developer page header, 4096 x 2304. play-header.png is this page screenshotted by
     headless Chrome at that size, then flattened so it has no transparency. Play crops the sides and top
     on phones, so everything sits in the middle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("../www/fonts/Fraunces-Variable.ttf"); font-weight: 100 900; }
@font-face { font-family: "Nunito"; src: url("../www/fonts/Nunito-Variable.ttf"); font-weight: 200 1000; }

html, body { margin: 0; }
body {
    width: 4096px;
    height: 2304px;
    overflow: hidden;
    background: #1c1220 radial-gradient(ellipse 2600px 1500px at 50% 50%, #2c1f31 0%, #1c1220 70%);
    color: #f6eef5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 150px;
}
.name {
    display: flex;
    align-items: center;
    gap: 90px;
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 260px;
    letter-spacing: -2px;
}
.name img {
    width: 340px;
    height: 340px;
    filter: drop-shadow(0 18px 0 #140c17);
}
h1 {
    margin: 0;
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 150px;
    line-height: 1.15;
    text-align: center;
}
h1 span { color: #f08fb8; }
</style>
</head>
<body>
<div class="name"><img src="../www/logo.svg" alt="">Greylock Labs</div>
<h1>We build software for those who<br><span>move slowly.</span></h1>
</body>
</html>
